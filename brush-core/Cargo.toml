[package]
name = "brush-core"
description = "Reusable core of a POSIX/bash shell (used by brush-shell)"
version = "0.5.0"
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "brush-parser/serde", "rpds/serde", "chrono/serde"]
experimental-parser = ["brush-parser/winnow-parser"]

[dependencies]
async-recursion = "1.1.1"
async-trait = "0.1.89"
brush-parser = { version = "^0.4.0", path = "../brush-parser" }
bon = "3.9.1"
cached = "2.0.2"
cfg-if = "1.0.4"
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
color-print = "0.3.7"
fancy-regex = "0.19.0"
futures = "0.3.32"
inherent = "1.0.13"
itertools = "0.14.0"
normalize-path = "0.2.1"
rand = "0.10.0"
rpds = "1.2.0"
serde = { version = "1.0.228", optional = true, features = ["derive"] }
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
tracing = "0.1.44"

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.40", features = ["io-util", "macros", "rt", "sync"] }

[target.'cfg(target_os = "twizzler")'.dependencies]
hostname = "0.4"
# The wasm-shaped feature set: no `process`/`signal` (both reap via SIGCHLD, which mlibc does
# not raise) and no `net` (pulls socket2, which has no twizzler arm). sys/twizzler.rs takes
# those modules from `stubs`, which are built on std::process instead.
tokio = { version = "1.40", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync"] }
# Same as the unix block below minus `uzers`: sys/twizzler.rs takes `users` from `stubs`,
# because uzers reads a passwd database this system does not have.
command-fds = "0.3.2"
libc = "0.2"
nix = { version = "0.31.2", features = [
    "fs",
    "poll",
    "process",
    "signal",
    "term",
    "user",
] }
terminfo = "0.9.0"

[target.'cfg(all(any(unix, windows), not(target_os = "twizzler")))'.dependencies]
hostname = "0.4"
tokio = { version = "1.40", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
] }

[target.'cfg(all(unix, not(target_os = "twizzler")))'.dependencies]
command-fds = "0.3.2"
libc = "0.2"
nix = { version = "0.31.2", features = [
    "fs",
    "poll",
    "process",
    "resource",
    "signal",
    "term",
    "user",
] }
terminfo = "0.9.0"
uzers = "0.12.2"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }
uuid = { version = "1.23.1", features = ["js"] }

[dev-dependencies]
anyhow = "1.0.102"
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
tempfile = "3.27.0"
